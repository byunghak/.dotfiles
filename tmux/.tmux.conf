set -g default-command "zsh"

set -g base-index 1
set -g pane-base-index 1
set -g status-interval 1
set -g history-limit 3000
set -g set-clipboard on
set -g repeat-time 0
set -g focus-events on
set -g renumber-windows on 
set -g status-style fg=yellow,bg=default #yellow and base02
set -g default-terminal "${TERM}"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -gs escape-time 0
setw -g mouse on
setw -g mode-keys vi
setw -g window-status-style fg=brightblue,bg=default #base0 and default
setw -g window-status-current-style fg=brightred,bg=default #orange and default
# claude pane 상태 라벨. @claude_state 는 Claude Code hook(tmux-pane-claude.sh)이 적고,
# 제목줄(pane-border-status)도 그 hook 이 claude 가 도는 window 에만 켠다
setw -g pane-border-format "#{?#{==:#{@claude_state},waiting},#[bg=red#,fg=black#,bold] ● 결정 대기 #[default] ,#{?#{==:#{@claude_state},idle},#[fg=yellow#,bold] ○ 입력 대기 #[default] ,#{?#{==:#{@claude_state},busy},#[fg=green] · #{?@claude_activity,#{@claude_activity},작업 중} #[default] ,}}}#{?@claude_agents_running,#[fg=cyan] ⚙ agent #{@claude_agents_running} #[default] ,}#{pane_title}"
# 테두리 선도 상태 색으로 칠한다 (결정 대기 빨강 / 입력 대기 노랑 / 작업 중 초록 깜빡임). claude 가 아닌 pane 은 기존 색
# 색이 상태를 뜻하게 되어 활성 pane 은 색 대신 화살표로 가리킨다
setw -g pane-border-style "#{?#{==:#{@claude_state},waiting},fg=red#,bold,#{?#{==:#{@claude_state},idle},fg=yellow,#{?#{==:#{@claude_state},busy},fg=green#,blink,default}}}"
setw -g pane-active-border-style "#{?#{==:#{@claude_state},waiting},fg=red#,bold,#{?#{==:#{@claude_state},idle},fg=yellow#,bold,#{?#{==:#{@claude_state},busy},fg=green#,bold#,blink,#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=green}}}}}"
setw -g pane-border-indicators arrows

# custom key
bind r source-file ~/.tmux.conf
bind T swap-window -t 0
bind -r m resize-pane -Z

# pane key
bind x kill-pane \; if-shell -F '#{@claude_grid}' 'select-layout tiled'
bind K kill-session
bind c new-window -c "#{pane_current_path}"
bind v split-window -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"
# claude pane이 이미 있으면 그 아래에 쌓고(높이 균등 재조정), 없으면 우측 full-height로 시작
bind i if-shell "tmux list-panes -F '##{pane_title}' | grep -q '^✳'" \
  "split-window -v -t '{bottom-right}' -c '#{pane_current_path}' 'claude' ; run-shell '~/.dotfiles/tmux/even-claude-panes.sh'" \
  "split-window -fh -p 30 -c '#{pane_current_path}' 'claude'"
# 현재 window 에 claude pane 을 하나 추가하고 같은 크기로 편다 (최대 4x4)
bind g run-shell '~/.dotfiles/tmux/claude-grid.sh "#{window_id}" "#{pane_current_path}"'
# 현재 window 의 pane 크기를 다시 맞춘다. zoom 중이면 layout 이 먹지 않으므로 먼저 푼다
bind R if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z' \; select-layout tiled
# bind g 로 만든 window 는 pane 이 닫혀도 다시 편다
# claude 종료로 닫히면 pane-exited, bind x 로 닫으면 바인딩에서 직접 편다
set-hook -g pane-exited "run-shell '~/.dotfiles/tmux/even-claude-grids.sh'"
# 현재 pane 의 claude 만 끄고 같은 세션으로 다시 연다 (r = 설정 리로드와 짝)
bind C-r run-shell '~/.dotfiles/tmux/restart-claude-pane.sh "#{pane_id}"'

# vi mode copy & paste
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer

# Smart pane switching with awareness of Vim splits

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Cmd+hjkl(Ghostty 가 M-hjkl 로 보냄) = 그 방향 pane 과 자리 바꾸기. nvim 에선 LazyVim 의 Alt+j/k 줄 이동을 살린다
# swap-pane 은 포커스를 원래 자리에 둔다. 인자 없는 select-pane 은 키를 누른 pane(= 옮긴 pane)을 고른다
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'swap-pane -t "{left-of}" ; select-pane'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'swap-pane -t "{down-of}" ; select-pane'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'swap-pane -t "{up-of}" ; select-pane'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'swap-pane -t "{right-of}" ; select-pane'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
